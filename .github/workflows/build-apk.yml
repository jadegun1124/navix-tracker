name: Build Android APK (umap)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build umap Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets into Native Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied to Android:"
          ls -la android/app/src/main/assets/public/

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/umap-v1.0.0-tracker.apk
          echo "APK successfully built:"
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umap-v1.0.0-tracker-apk
          path: output/umap-v1.0.0-tracker.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: 'umap Android APK Release v1.0.0'
          body: |
            ### 🛰️ umap 안드로이드 전용 고정밀 위치추적 앱 (APK)
            - **앱 패키지명**: `kr.co.umap.tracker`
            - **고정밀 GPS 4단계 필터링 탑재**:
              1. 오차 반경 50m 이하 허용 (50m 초과 좌표 자동 폐기)
              2. 정지 중 5m 미만 센서 노이즈 필터링
              3. 2D 칼만 필터(Kalman Filter) 실시간 궤적 스무딩
              4. 시속 145km/h 초과 비정상 순간 점프 폐기
            - **화면 꺼짐 방지(WakeLock)** 및 포그라운드 위치 수신 지원
            - **설치 방법**: 아래 Assets에서 `umap-v1.0.0-tracker.apk` 파일을 스마트폰에 다운로드하여 설치하세요.
          files: output/umap-v1.0.0-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK (Umap)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Umap Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VITE_FAMILY_SYNC_URL: ${{ secrets.VITE_FAMILY_SYNC_URL != '' && secrets.VITE_FAMILY_SYNC_URL || 'https://umap-family-sync.umap-jadegun.workers.dev' }}
        run: |
          if [ -z "${VITE_VWORLD_API_KEY}" ] && [ -n "${VWORLD_API_KEY}" ]; then
            export VITE_VWORLD_API_KEY="${VWORLD_API_KEY}"
          fi
          # Vite reads VITE_VWORLD_API_KEY only while this build runs and writes it into the APK assets.
          VITE_VWORLD_API_KEY="$(printf '%s' "${VITE_VWORLD_API_KEY}" | tr -d '[:space:]')"
          export VITE_VWORLD_API_KEY
          if [ -n "${VITE_VWORLD_API_KEY}" ]; then
            echo "VWorld key is present for this APK build."
          else
            echo "VWorld key is missing. The APK will show the Korean missing-key notice."
          fi
          # Public worker URL. Not a secret. An Actions secret overrides it when set.
          VITE_FAMILY_SYNC_URL="$(printf '%s' "${VITE_FAMILY_SYNC_URL}" | tr -d '[:space:]')"
          export VITE_FAMILY_SYNC_URL
          if [ "${VITE_FAMILY_SYNC_URL}" = "https://umap-family-sync.umap-jadegun.workers.dev" ]; then
            echo "Family sync URL is the public worker default."
          else
            echo "Family sync URL comes from the Actions secret."
          fi
          npm run build

      - name: Copy Web Assets into Native Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied to Android:"
          ls -la android/app/src/main/assets/public/

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find android/ -name "*.apk" -ls
          find android/ -name "*.apk" -exec cp {} output/umap-v1.16.0-tracker.apk \;
          echo "Output directory contents:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umap-v1.16.0-tracker-apk
          path: output/umap-v1.16.0-tracker.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.16.0
          name: 'Umap Android APK v1.16.0'
          make_latest: true
          body: |
            ### Umap 안드로이드 앱 1.16.0
            - 회사 홈 (GitHub Pages): https://jadegun1124.github.io/umap/
            - 이 파일: GitHub Releases APK. Google Play에는 없습니다.
            - 다운로드: https://github.com/jadegun1124/umap/releases/download/v1.16.0/umap-v1.16.0-tracker.apk
            - 표시 이름: Umap
            - 패키지: `kr.co.umap.tracker`
            - versionName: 1.16.0
            - versionCode: 17
            - 최근 여정 카드 안에 경로 미리보기가 있고, 카드를 누르면 지도에서 ▶ 로 재생합니다. 출발·도착은 주소로 보이고, 같은 이동은 카드 하나로 합칩니다.
            - 개인 대화는 두 사람만 봅니다. 가족 목록과 가족 위치 응답에는 그 글이 섞이지 않습니다.
            - 관리자와 피관리자 모두 하단 탭 없이 지도만 둡니다. 왼쪽 위 메뉴에서 프로필, 우리 집, 알림, 설정을 엽니다. 지도에서 사람을 누르면 그 사람의 기록을 날짜 하나로 봅니다. 기본 날짜는 오늘이고, 날짜를 누르면 30일 목록이 열립니다. 개인 대화는 그 기록 화면에서 엽니다.
            - 안드로이드 뒤로 가기는 루트 지도에서 한 번에 종료하지 않습니다. 한 번 더 누르면 앱이 종료됩니다.
            - 위치 유지를 켠 뒤에는 앱 안에서 끄는 버튼이 없습니다.
            - 이름과 프로필 사진은 각자 이 폰에서 정합니다. 가족 서버에 연결되면 같은 초대의 다른 폰 지도, 사람 목록, 기록 제목에 보입니다. 다른 사람의 프로필은 바꿀 수 없습니다.
            - 가족 목록은 사람, 근처, 배터리, 지금만 보여 줍니다.
            - 걷는 경로는 약 2.5m마다 점을 남깁니다. 화면에서 선을 펴는 거리는 0.85m이고, 14m보다 긴 현에는 실제로 걷던 중간 점을 다시 넣습니다. 그려지는 실선은 그 점 위에서만 한 번 둥글게 잇습니다. 머무름 중 흔들림과 갔다가 바로 돌아오는 스파이크는 선에 잇지 않습니다. 유료 도로 스냅은 쓰지 않습니다.
            - 이어진 걸음은 실선입니다. 점선은 48m 이상 비고 그 사이가 20초 이상일 때만 그립니다. 빈 구간을 도로 모양으로 채우지 않습니다.
            - 위치 유지는 고주기 GPS가 아닙니다. 걸음이 확인된 동안만 GPS 2.5초입니다. 약 45초 동안 12m 안쪽으로 머물면 2분, 7분 넘게 머물면 5분입니다. 시작과 프로세스 재시작도 2분입니다. 같은 설정으로 앱이 다시 보여도 GNSS를 2.5초로 다시 열지 않습니다. GPS가 켜져 있으면 네트워크 위치는 같이 요청하지 않습니다.
            - 가족 서버는 이동 중 8초 또는 25m, 머무름 중 2분에 한 번만 올립니다. 이 폰의 궤적은 받은 점마다 잇습니다.
            - 한곳에서 7분 머물면 그 이동을 최근 여정 카드로 남기고 오늘의 실시간 선에서는 뺍니다. 카드에는 시간, 거리, 출발·도착이 보이고, 전체 기록을 누르면 시간을 따라 마커가 움직입니다. 진행 중인 길은 지금으로 따로 보입니다. 80m 미만이거나 1분 미만은 카드로 만들지 않습니다. 기록은 이 폰에만 30일 남고 서버로 보내지 않습니다.
            - 가족 카드에 마지막 위치를 「방금 업데이트」 또는 「3분 전 업데이트」로 보여 줍니다.
            - 위치 공유 중에도 알림 목록에 Umap 상시 카드가 나오지 않습니다. 1.6.0의 빈 포그라운드 서비스 알림을 뺐습니다.
            - 앱을 열면 예전 채널 `umap_location`, `umap_location_quiet`, `umap_alert_watch` 를 지웁니다.
            - 가족 위치와 배터리는 초대 동기화 키로 위치 서버에 올라가고, 관리자 지도가 그 서버에서 받아 표시합니다. 예시 좌표는 없습니다.
            - SOS는 앱이 꺼져 있어도 Web Push 또는 알림 대기로 관리자에게 갑니다. 대기 중에는 알림 카드를 올리지 않고, SOS와 집 반경만 알림으로 옵니다.
            - 이 기기의 표시 이름, 권한 안내, 가족 지도, 30일 이동 기록, 우리 집 안심존, 초대 코드
            - 초대 QR은 카메라 권한을 물은 뒤에 읽고, 다시 물을 수 없으면 설정 화면을 엽니다.
            - 위치 유지는 사용자가 켠 뒤에만 시작합니다. 배터리 제한 없음이면 백그라운드 위치 간격을 유지합니다.
            - 항상 허용은 위치 액세스 권한 화면을 먼저 열고, 막히면 앱 권한 목록으로 엽니다.
            - 머무름 중 정확도 반경 안의 위치 흔들림은 이동 경로에 잇지 않습니다.
            - iOS 앱은 App Store / TestFlight에 없습니다.
            - 마이크, 문자, 주변 소리, 원격 경보음은 요청하지 않습니다.
            - 이전 파일: https://github.com/jadegun1124/umap/releases/tag/v1.15.0
          files: output/umap-v1.16.0-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

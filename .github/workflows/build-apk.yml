name: Build Android APK (Kinnex)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Kinnex Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VITE_FAMILY_SYNC_URL: ${{ secrets.VITE_FAMILY_SYNC_URL != '' && secrets.VITE_FAMILY_SYNC_URL || 'https://umap-family-sync.umap-jadegun.workers.dev' }}
          VITE_KAKAO_NATIVE_APP_KEY: ${{ secrets.VITE_KAKAO_NATIVE_APP_KEY }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
        run: |
          if [ -z "${VITE_VWORLD_API_KEY}" ] && [ -n "${VWORLD_API_KEY}" ]; then
            export VITE_VWORLD_API_KEY="${VWORLD_API_KEY}"
          fi
          # Vite reads VITE_VWORLD_API_KEY only while this build runs and writes it into the APK assets.
          VITE_VWORLD_API_KEY="$(printf '%s' "${VITE_VWORLD_API_KEY}" | tr -d '[:space:]')"
          export VITE_VWORLD_API_KEY
          if [ -n "${VITE_VWORLD_API_KEY}" ]; then
            echo "VWorld key is present for this APK build."
          else
            echo "VWorld key is missing. The APK will show the Korean missing-key notice."
          fi
          # Public worker URL. Not a secret. An Actions secret overrides it when set.
          VITE_FAMILY_SYNC_URL="$(printf '%s' "${VITE_FAMILY_SYNC_URL}" | tr -d '[:space:]')"
          export VITE_FAMILY_SYNC_URL
          if [ "${VITE_FAMILY_SYNC_URL}" = "https://umap-family-sync.umap-jadegun.workers.dev" ]; then
            echo "Family sync URL is the public worker default."
          else
            echo "Family sync URL comes from the Actions secret."
          fi
          npm run build

      - name: Copy Web Assets into Native Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied to Android:"
          ls -la android/app/src/main/assets/public/

      - name: Build release APK with Gradle
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY != '' && secrets.KAKAO_NATIVE_APP_KEY || secrets.VITE_KAKAO_NATIVE_APP_KEY }}
        run: |
          cd android
          # assembleRelease uses android/app/umap-sideload.keystore, the same
          # certificate as earlier sideload APKs. SHA-1 must stay
          # 00:57:37:35:22:70:B8:4C:7F:B6:01:61:29:BD:A9:A3:CD:09:35:0C.
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/kinnex-v1.37.0.apk
          echo "Output directory contents:"
          ls -lh output/

      - name: Require the committed sideload certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          "$APKSIGNER" verify --print-certs output/kinnex-v1.37.0.apk | tee output/apk-certs.txt
          python3 - <<'PY'
          import pathlib, re, subprocess
          certs = pathlib.Path("output/apk-certs.txt").read_text()
          apk = re.search(r"SHA-256 digest: ([0-9a-fA-F:]+)", certs)
          if not apk:
              raise SystemExit("APK has no SHA-256 certificate digest")
          listed = subprocess.check_output([
              "keytool", "-list", "-v",
              "-keystore", "android/app/umap-sideload.keystore",
              "-storepass", "umap-sideload",
              "-alias", "umap-sideload",
          ], text=True)
          store = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", listed)
          if not store:
              raise SystemExit("keystore has no SHA256 fingerprint")
          def norm(value):
              return value.replace(":", "").lower()
          if norm(apk.group(1)) != norm(store.group(1)):
              raise SystemExit(
                  f"APK certificate {apk.group(1)} does not match sideload keystore {store.group(1)}"
              )
          if "CN=Umap Sideload" not in certs:
              raise SystemExit("APK certificate subject is not the sideload key")
          print("Sideload certificate matches the committed keystore.")
          sha1 = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", listed)
          if not sha1:
              raise SystemExit("keystore has no SHA1 fingerprint")
          expected = "005737352270b84c7fb6016129bda9a3cd09350c"
          if norm(sha1.group(1)) != expected:
              raise SystemExit(f"keystore SHA1 {sha1.group(1)} is not the Kakao release hash")
          print(f"Release keystore SHA1={sha1.group(1)}")
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinnex-v1.37.0-apk
          path: output/kinnex-v1.37.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.37.0
          name: 'Kinnex Android APK v1.37.0'
          make_latest: true
          body: |
            ### Kinnex 안드로이드 앱 1.37.0
            - 하계1차청구아파트 안에 있으면 단지 이름과 동을 쓰고, 바로 옆 노원소방서로 남기지 않습니다. 안드로이드에서는 「이 브라우저 안에서만 공유됩니다」를 띄우지 않습니다. 예전 앱으로 위치를 보내는 가족 줄에는 「상대가 앱을 업데이트해야 위치가 보여요」가 보입니다.
            - 위치 좌표, 이동 기록, 그 좌표로 만든 장소 이름은 가족 기기만 푸는 AES-GCM 암호문으로 서버에 둡니다. 가족 키는 구성원 공개키로 감싸고, 구성원을 지우면 가족 키를 바꿉니다. 계정 키는 복구 코드로만 다시 만들 수 있습니다. 카카오·네이버만으로 들어오면 계정과 가족 방은 돌아오고, 지난 기록은 복구 코드를 입력하거나 다른 가족이 온라인이면 앞으로의 위치만 다시 보입니다. 1.35 이하는 암호문 위치를 지도에 찍지 못합니다.
            - 위치는 HTTPS로만 보내고, 안드로이드는 평문 HTTP를 막습니다. 기기에 남는 위치는 Android Keystore 키로 감쌉니다. 가족 위치 조회는 그 방의 구성원만 되고, 초대 링크는 24시간 동안 한 번만 열립니다. 설정 「위치정보 이용·제공 기록」에 수집·이용·제공이 남고, 「개인위치정보 이용 동의」를 철회하면 수집이 멈춥니다.
            - 가족 밖에 개인정보나 위치·기록·장소 이름을 넘기면 서버가 제공 기록을 남깁니다. 표시 이름, 카카오·네이버 계정, 가족 구성, 기기, 계정·복구 정보, 위치, 기록, 장소 이름처럼 실제로 넘긴 종류만 적고 그 값과 좌표는 적지 않습니다. 누구의 자료인지, 기간, 받는 곳, 이유, 시각, 처리한 사람을 해시로 이어 붙이고 일반 API로는 지우지 않습니다. 설정 「위치정보 이용·제공 기록」에서 내 기록만 봅니다. 지금은 제3자 제공 경로가 없어 비어 있습니다. 회원 탈퇴 후에도 제공일부터 6개월이 지나기 전에는 그 메타데이터만 남습니다.
            - 로그인 뒤에 위치 권한이 「항상 허용」이 아니거나 정확한 위치가 아니면 앱을 막는 안내를 띄웁니다. 「설정에서 항상 허용 켜기」는 안드로이드 11 이상에서 이 앱의 위치 권한 화면을 열고, 안드로이드 10에서는 백그라운드 위치 창을 엽니다. 앱으로 돌아와 항상 허용이고 정확한 위치이면 안내가 사라집니다. 뒤로 가기와 바깥 탭으로는 닫히지 않습니다. 첫 화면의 카카오·네이버·복구 코드·새로 시작은 그대로입니다.
            - 구성원을 추가하면 내가 적은 이름과 상대의 표시 이름이 카드 두 개로 보이지 않습니다. 그 사람의 계정 이름이 보이기 전에는 초대한 이름이 임시로 남고, 이름이 오면 한 카드로 합칩니다. 위치와 기록은 memberId에만 묶입니다.
            - 장소 이름은 최신 정확한 위치에서 실제로 가장 가까운 곳입니다. 하계1차청구아파트 안이면 그 단지이고, 단지 밖이고 노원소방서가 더 가까우면 소방서입니다.
            - 실내 GPS처럼 오차 20–80m인 점은 현재 위치로 쓰고, 「오차가 큰 점은 버리고…」 안내는 그 점이 들어오면 사라집니다. 80m를 넘는 점만 기다립니다. 궤적 선은 예전처럼 40m보다 나쁜 점을 잇지 않습니다.
            - 위치 공유는 메뉴에서 빼었습니다. 초대를 만들 때와 받을 때 위치 공유 허용을 묻습니다. 이미 공유 중이면 다시 묻지 않고 그 방에도 바로 나갑니다. 허용하면 지금 시작되고 앱을 다시 열어도 유지됩니다. 나중에를 고르면 내 위치는 나가지 않고, 가족 목록에서 다시 허용할 수 있습니다.
            - 첫 화면은 「카카오로 로그인」「네이버로 로그인」「복구 코드로 불러오기」「새로 시작」입니다. 이름을 먼저 적고 넘어가지 않습니다. 키가 없으면 그 버튼은 비활성이고 짧은 안내만 보입니다.
            - 로그인한 계정이 서버에 이미 있으면 표시 이름, 가족, 기록을 그대로 불러오고 이름을 다시 묻지 않습니다. 새 계정이면 그 다음에 표시 이름을 묻습니다.
            - 설정 「로그아웃」은 서버 백업을 남기고, 이 폰의 봉인된 세션도 지웁니다. 다시 열면 로그인 화면입니다. 카카오·네이버 또는 복구 코드로 다시 불러올 수 있다고 확인합니다.
            - 설정 「회원 탈퇴」는 서버 계정, 위치 기록, 카카오·네이버 연결, 복구 코드를 영구히 지운 뒤 이 폰을 처음 화면으로 되돌립니다. 제3자 제공 기록은 좌표 없이 6개월이 지난 뒤에 지웁니다.
            - 카카오는 Android Kakao SDK, 네이버는 인가 코드만 앱에서 받고 Worker가 `nid/me`로 확인합니다. 여러 로그인을 한 계정에 연결할 수 있습니다.
            - 앱을 지우고 다시 깔아도 카카오·네이버 또는 복구 코드로 같은 사람과 가족 방, 최근 30일 기록을 불러옵니다. 다른 폰의 예전 카드가 살아나고 사람이 두 명이 되지 않습니다.
            - 설정에 12자리 복구 코드가 보입니다. 첫 화면의 「복구 코드로 불러오기」는 지금 동작합니다.
            - 아파트 단지 안에 있으면 「하계1차청구아파트 104동」처럼 단지·동을 쓰고, 옆 노원소방서 같은 POI는 단지 밖이고 아주 가까울 때만 씁니다. 머무름 중심점으로 GPS 흔들림을 맞춥니다.
            - 안드로이드 자동 백업과 기기 간 이전을 끕니다. 다시 설치한 뒤 복원은 카카오·네이버 또는 복구 코드로만 합니다. 업데이트는 이 폰의 데이터를 지우지 않습니다.
            - sharing:false 위치 기록만으로 그 사람의 궤적·여정·방문을 지우지 않습니다. 서버가 떠난 것을 알려 주거나 7일 뒤 직접 지울 때만 카드를 빼고, 떠날 때도 이 폰의 기록은 남깁니다.
            - 아직 위치를 올리는 구성원의 예전 별칭이 그 사람을 떠난 것으로 만들지 않습니다.
            - 기록 전체 화면을 닫거나 재생을 열면 지도 크기를 다시 맞춰, 빈 지도나 어긋난 중심으로 돌아가지 않습니다.
            - 앱을 지운 가족의 카드·핀이 보는 사람 위치를 쓰지 않습니다. 위치는 memberId로만 묶고, 이름이나 내 좌표로 다른 사람을 채우지 않습니다.
            - 위치를 올리지 않는 가족은 마지막 위치를 흐리게 두고 「마지막 위치 · 3시간 전」처럼 보입니다. 7일이 지나면 「연결 끊김」과 지우기가 열립니다. 서버가 떠난 것을 알면 바로 뺍니다.
            - 집처럼 좁은 반경이나 느린 속도로 오래 머문 구간은 여정이 아니라 머무름입니다. 이미 저장된 같은 카드도 숨깁니다.
            - 기록 카드, 재생, 방문한 곳 주소는 아파트·동 또는 가까운 가게 이름을 쓰고 「근처」는 쓰지 않습니다.
            - 자정을 넘기거나 오늘이 아닌 여정은 「10/28 21:28 → 10/29 09:29」처럼 날짜를 붙입니다.
            - 가족 핀이나 목록을 한 번 누르면 그 사람의 현재 위치로 지도가 이동하고 이름이 보입니다. 같은 사람을 다시 누르면 기록이 열립니다. 다른 사람을 누르면 그 사람으로 옮기고, 빈 지도를 누르면 선택이 풀립니다.
            - 런처, 스플래시, 파비콘을 남색에서 시안으로 이어지는 파란 타일과 흰 위치 핀(파란 고리, 흰 점)으로 바꿨습니다. 적응형 아이콘은 그라데이션이 전체를 채우고 핀만 안전 영역 안에 둡니다.
            - 메인 지도는 가족 카드가 「지금」인 동안만 이동 중 실선을 그립니다. 「머무름」이면 선이 없고, 점선으로 이은 빈 구간도 메인에 그리지 않습니다. 이동 중 선의 끝은 그 사람 핀과 같습니다. 걷거나 시속 약 7km 이상으로 움직인 점은 촘촘히 남고, 순식간에 멀리 튄 점과 제자리 흔들림만 뺍니다. 걸음 5분, 시속 약 7km 이상은 12분이 지나면 그 구간을 기록으로 넘기고 메인 선에서는 뺍니다. 같은 동네에 머문 GPS 흔들림이나 점만 두 개인 빈 구간은 여정 카드로 남기지 않습니다. 재생은 이어진 점만 따라갑니다.
            - 실내·건물 옆에서 머무는 동안 GPS가 흔들려도 메인 지도와 기록 재생에 지그재그나 낙서를 그리지 않습니다. 시속이 거의 0이거나 정확도가 나쁜 점은 체류 반경 안에 있으면 궤적에 넣지 않고, 이미 쌓인 머무름 구간은 한 점으로 모읍니다. 걷거나 차량으로 움직이는 선은 그대로입니다. 걸음 5분, 시속 약 7km 이상 12분 기록 넘김도 그대로입니다.
            - 기록의 각 여정 카드는 시간, 이동 수단과 거리, 출발·도착 주소 아래에 그 구간의 파란 경로를 지도 미리보기로 보여 줍니다. 선은 구간에 맞춰 들어갑니다.
            - 메뉴의 움직임 알림에서 고른 가족에게만 「○○님이 움직이기 시작했어요」「○○님이 멈췄어요」를 보냅니다. 아무도 고르지 않으면 보내지 않습니다. 걸음은 약 45초, 시속 약 7km 이상은 약 3분 넘게 머물면 멈춤이고, 실제로 이동한 뒤에만 시작입니다. GPS 간격은 그대로입니다.
            - 설정에 앱 버전이 보입니다. 예: 앱 버전 1.37.0 (43).
            - 설정과 메뉴의 「가족 방 지우기」로 이 폰의 가족 목록과 동기화를 지웁니다. 이 폰이 만든 방은 서버에서도 지우고, 초대로 들어간 방은 이 폰에서만 나갑니다.

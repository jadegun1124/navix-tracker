name: Build Android APK (Umap)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Umap Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Copy Web Assets into Native Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied to Android:"
          ls -la android/app/src/main/assets/public/

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find android/ -name "*.apk" -ls
          find android/ -name "*.apk" -exec cp {} output/umap-v1.0.0-tracker.apk \;
          echo "Output directory contents:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umap-v1.0.0-tracker-apk
          path: output/umap-v1.0.0-tracker.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 'Umap Android APK v1.0.0'
          body: |
            ### Umap 안드로이드 앱
            - 표시 이름: Umap
            - 패키지: `kr.co.umap.tracker`
            - Google 로그인, 권한 안내, 가족 지도, 우리 집 안심존, 초대 코드
            - 마이크, 문자, 주변 소리, 원격 경보음은 요청하지 않습니다
            - 설치: Assets의 `umap-v1.0.0-tracker.apk`
          files: output/umap-v1.0.0-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK (Umap)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Umap Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VITE_FAMILY_SYNC_URL: ${{ secrets.VITE_FAMILY_SYNC_URL != '' && secrets.VITE_FAMILY_SYNC_URL || 'https://umap-family-sync.umap-jadegun.workers.dev' }}
        run: |
          if [ -z "${VITE_VWORLD_API_KEY}" ] && [ -n "${VWORLD_API_KEY}" ]; then
            export VITE_VWORLD_API_KEY="${VWORLD_API_KEY}"
          fi
          # Vite reads VITE_VWORLD_API_KEY only while this build runs and writes it into the APK assets.
          VITE_VWORLD_API_KEY="$(printf '%s' "${VITE_VWORLD_API_KEY}" | tr -d '[:space:]')"
          export VITE_VWORLD_API_KEY
          if [ -n "${VITE_VWORLD_API_KEY}" ]; then
            echo "VWorld key is present for this APK build."
          else
            echo "VWorld key is missing. The APK will show the Korean missing-key notice."
          fi
          # Public worker URL. Not a secret. An Actions secret overrides it when set.
          VITE_FAMILY_SYNC_URL="$(printf '%s' "${VITE_FAMILY_SYNC_URL}" | tr -d '[:space:]')"
          export VITE_FAMILY_SYNC_URL
          if [ "${VITE_FAMILY_SYNC_URL}" = "https://umap-family-sync.umap-jadegun.workers.dev" ]; then
            echo "Family sync URL is the public worker default."
          else
            echo "Family sync URL comes from the Actions secret."
          fi
          npm run build

      - name: Copy Web Assets into Native Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied to Android:"
          ls -la android/app/src/main/assets/public/

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find android/ -name "*.apk" -ls
          find android/ -name "*.apk" -exec cp {} output/umap-v1.2.0-tracker.apk \;
          echo "Output directory contents:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umap-v1.2.0-tracker-apk
          path: output/umap-v1.2.0-tracker.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: 'Umap Android APK v1.2.0'
          make_latest: true
          body: |
            ### Umap 안드로이드 앱 1.2.0
            - 회사 홈 (GitHub Pages): https://jadegun1124.github.io/umap/
            - 이 파일: GitHub Releases APK. Google Play에는 없습니다.
            - 다운로드: https://github.com/jadegun1124/umap/releases/download/v1.2.0/umap-v1.2.0-tracker.apk
            - 표시 이름: Umap
            - 패키지: `kr.co.umap.tracker`
            - versionName: 1.2.0
            - versionCode: 3
            - Google 로그인, 권한 안내, 가족 지도, 우리 집 안심존, 초대 코드
            - iOS 앱은 App Store / TestFlight에 없습니다.
            - 마이크, 문자, 주변 소리, 원격 경보음은 요청하지 않습니다.
            - 이전 파일: https://github.com/jadegun1124/umap/releases/tag/v1.1.0
          files: output/umap-v1.2.0-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

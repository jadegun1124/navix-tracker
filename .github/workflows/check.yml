name: Check

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test family sync
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build without secrets
        run: npm run build

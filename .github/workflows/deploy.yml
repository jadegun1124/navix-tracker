name: Deploy Umap homepage

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Static Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VITE_FAMILY_SYNC_URL: ${{ secrets.VITE_FAMILY_SYNC_URL != '' && secrets.VITE_FAMILY_SYNC_URL || 'https://umap-family-sync.umap-jadegun.workers.dev' }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "${VITE_VWORLD_API_KEY}" ] && [ -n "${VWORLD_API_KEY}" ]; then
            export VITE_VWORLD_API_KEY="${VWORLD_API_KEY}"
          fi
          # Vite reads VITE_VWORLD_API_KEY only while this build runs and writes it into the Pages JS.
          VITE_VWORLD_API_KEY="$(printf '%s' "${VITE_VWORLD_API_KEY}" | tr -d '[:space:]')"
          export VITE_VWORLD_API_KEY
          if [ -n "${VITE_VWORLD_API_KEY}" ]; then
            echo "VWorld key is present for this Pages build."
          else
            echo "VWorld key is missing. Pages will show the Korean missing-key notice."
          fi
          # Public worker URL. Not a secret. An Actions secret overrides it when set.
          VITE_FAMILY_SYNC_URL="$(printf '%s' "${VITE_FAMILY_SYNC_URL}" | tr -d '[:space:]')"
          export VITE_FAMILY_SYNC_URL
          if [ "${VITE_FAMILY_SYNC_URL}" = "https://umap-family-sync.umap-jadegun.workers.dev" ]; then
            echo "Family sync URL is the public worker default."
          else
            echo "Family sync URL comes from the Actions secret."
          fi
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

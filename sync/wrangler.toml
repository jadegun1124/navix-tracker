name = "umap-family-sync"
main = "worker.mjs"
compatibility_date = "2026-01-15"
workers_dev = true

[[durable_objects.bindings]]
name = "FAMILY_ROOM"
class_name = "FamilyRoom"

[[durable_objects.bindings]]
name = "FAMILY_ACCOUNT"
class_name = "FamilyAccount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FamilyAccount"]

# Public Naver client id. NAVER_CLIENT_SECRET is a Worker secret and is not in this file.
[vars]
NAVER_CLIENT_ID = "dQCiRLIzbNkDG6ULiroD"

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true
